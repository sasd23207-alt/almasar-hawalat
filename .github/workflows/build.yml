name: build

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The android/ folder is generated here for now. Later it is committed,
      # because we will need to edit its manifest (share target, permissions).
      - name: Generate Android project files
        run: flutter create --platforms=android --org com.almasar --project-name almasar_hawalat .

      - name: Set Android compile SDK for current share plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          source = p.read_text()
          source = source.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 37")
          p.write_text(source)
          if "compileSdk = 37" not in p.read_text():
              raise SystemExit("Failed to set compileSdk to 37")
          PY

      - name: Enable receiving WhatsApp exported text files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()
          pattern = r'(<activity\b[^>]*android:name="[^"]*MainActivity"[^>]*>)(.*?)(</activity>)'
          match = re.search(pattern, text, flags=re.S)
          if not match:
              raise SystemExit("MainActivity activity block not found; refusing to produce an APK without share support")
          body = match.group(2)
          share_filters = '''
                  <intent-filter>
                      <action android:name="android.intent.action.SEND" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <data android:mimeType="text/plain" />
                  </intent-filter>
                  <intent-filter>
                      <action android:name="android.intent.action.SEND_MULTIPLE" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <data android:mimeType="text/plain" />
                  </intent-filter>
          '''
          if 'android.intent.action.SEND_MULTIPLE' not in body:
              body = body + share_filters
          p.write_text(text[:match.start(2)] + body + text[match.end(2):])
          PY

      # flutter create adds a sample counter-app test that does not match our app.
      - name: Remove the generated sample test
        run: rm -f test/widget_test.dart

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: almasar-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      # Download link: a GitHub Release holding the APK (only for the main branch).
      - name: Publish the APK as a release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-debug.apk

      # Test-only APK from the development branch; never use for real financial data.
      - name: Publish development APK as a test prerelease
        if: github.ref == 'refs/heads/feature/local-database-mobile-app'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          name: Test build ${{ github.run_number }}
          prerelease: true
          files: build/app/outputs/flutter-apk/app-debug.apk
